experiment_name: "churn-prediction"
model_name: "churn-predictor"

features:
  numerical:
    - tenure_months
    - total_spending_3m
    - avg_monthly_charge
    - payment_failure_rate
    - transaction_count_3m
    - support_tickets_3m
    - avg_resolution_days
    - avg_sentiment
  categorical:
    - contract_type

target: churned

# Registration gate: a trained model is only promoted into the MLflow Model
# Registry when its TEST roc_auc reaches this threshold. Runs that miss it are
# still tracked as experiments — they just do not create a registry version.
registration:
  min_roc_auc: 0.66

random_forest:
  n_estimators: 200
  max_depth: 10
  min_samples_leaf: 5
  class_weight: "balanced"
  random_state: 42

xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 3
  random_state: 42
  eval_metric: auc
  use_label_encoder: false

xgboost_tuned:
  n_estimators: 500
  max_depth: 5
  learning_rate: 0.03
  subsample: 0.9
  colsample_bytree: 0.9
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1.0
  scale_pos_weight: 3
  random_state: 42
  eval_metric: auc

train_test_split:
  test_size: 0.20
  validation_size: 0.20
  random_state: 42
  stratify: true

metrics:
  - accuracy
  - f1
  - roc_auc
  - precision
  - recall
