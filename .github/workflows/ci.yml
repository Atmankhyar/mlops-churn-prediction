name: CI — Lint, Test, Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 src/ api/ scripts/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --count --statistics

      - name: Check formatting with black
        run: black --check src/ api/ scripts/ --line-length 100

      - name: Sort imports check (isort)
        run: isort --check-only src/ api/ scripts/

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov=api \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churn-api:ci-${{ github.sha }} .

      - name: Smoke test — container health
        run: |
          docker run -d \
            --name churn-api-test \
            -p 8000:8000 \
            -e MLFLOW_TRACKING_URI=http://localhost:5000 \
            -e ENVIRONMENT=test \
            churn-api:ci-${{ github.sha }}
          sleep 8
          # Health check (model won't load but endpoint should respond)
          curl -f http://localhost:8000/health || true
          docker stop churn-api-test
