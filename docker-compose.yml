
services:
  api:
    build: .
    container_name: churn-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      INFERENCE_LOG_DB: /app/monitoring/inference_log.db
    depends_on:
      mlflow:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./monitoring:/app/monitoring
      - ./mlflow-artifacts:/mnt/mlflow-artifacts

  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    working_dir: /mlflow
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir "mlflow==2.13.0" "sqlalchemy==1.4.54" &&
        exec mlflow server \
          --backend-store-uri sqlite:////mlflow/mlflow.db \
          --default-artifact-root /mlflow/mlflow-artifacts \
          --host 0.0.0.0 \
          --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlflow-artifacts:/mlflow/mlflow-artifacts
    restart: unless-stopped